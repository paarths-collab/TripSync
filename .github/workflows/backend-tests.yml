name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: tripsync_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: tripsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripsync_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run PostgreSQL concurrency and regression tests
        env:
          TRIPSYNC_TEST_PG_URL: postgresql+psycopg2://tripsync_test:test-only@127.0.0.1:5432/tripsync_test
        run: >-
          python -m pytest -q tests/test_pooling_postgres.py
          tests/test_campus_request_postgres.py tests/test_campus_party_postgres.py
          tests/test_repair_postgres.py
          tests/test_campus_acceptance.py::test_postgres_two_simultaneous_approvals_involving_one_student_yield_exactly_one_party

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
